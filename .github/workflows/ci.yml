name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner.lowercase }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.7.4
      - run: ruff check services mock-provider

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install pytest
          pip install -r services/api/requirements.txt -r services/worker/requirements.txt
      - run: PYTHONPATH=services/api pytest services/api/tests
      - run: PYTHONPATH=services/worker pytest services/worker/tests

  build-scan-push:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    env:
      DB_PASSWORD: ci-build-dummy
      RABBITMQ_PASSWORD: ci-build-dummy
    steps:
      - uses: actions/checkout@v4
      - name: Set APP_VERSION
        run: echo "APP_VERSION=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cd deploy
          APP_VERSION="$APP_VERSION" IMAGE_PREFIX="$IMAGE_PREFIX" \
            docker compose build api worker mock-provider
      - name: Scan api
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/payment-api:${{ env.APP_VERSION }}
          exit-code: "1"
          severity: CRITICAL,HIGH
      - name: Scan worker
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/payment-worker:${{ env.APP_VERSION }}
          exit-code: "1"
          severity: CRITICAL,HIGH
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          for svc in payment-api payment-worker mock-provider; do
            docker tag northwind/$svc:$APP_VERSION "$IMAGE_PREFIX/$svc:$APP_VERSION" 2>/dev/null || \
              docker tag "${IMAGE_PREFIX}/$svc:$APP_VERSION" "$IMAGE_PREFIX/$svc:$APP_VERSION"
            docker push "$IMAGE_PREFIX/$svc:$APP_VERSION"
          done

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [build-scan-push]
    permissions:
      contents: read
      packages: read
    env:
      SECRETS_SOURCE: env
      PULL_IMAGES: "1"
      DB_PASSWORD: ci-db-password
      RABBITMQ_PASSWORD: ci-rabbit-password
      PROVIDER_API_KEY: ci-provider-key
      API_PORT: "8080"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - name: Set APP_VERSION
        run: echo "APP_VERSION=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - name: Login GHCR (pull)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy from registry (same path as CD)
        run: |
          chmod +x deploy/*.sh deploy/vault/*.sh scripts/*.sh
          COMPOSE_EXTRA_FILE=docker-compose.ci.yml ./deploy/deploy.sh stage
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=200
      - name: Down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down