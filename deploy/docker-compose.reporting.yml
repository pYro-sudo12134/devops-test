name: payment-stack

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-labels-analytics: &labels-analytics
  com.northwind.owner: analytics

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    ports:
      - "127.0.0.1:9090:9090"
    labels: *labels-analytics
    logging: *default-logging
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    labels: *labels-analytics
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    labels: *labels-analytics
    logging: *default-logging
    restart: unless-stopped

  reporting-ui:
    image: nginx:1.27.3
    volumes:
      - ./reporting-ui/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${REPORTING_PORT:-8090}:80"
    depends_on:
      - grafana
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 5s
      retries: 20
    labels: *labels-analytics
    logging: *default-logging
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    labels: *labels-analytics
    logging: *default-logging
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.4.2
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ../monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "127.0.0.1:12345:12345"
    depends_on:
      - loki
    labels: *labels-analytics
    logging: *default-logging
    restart: unless-stopped

volumes:
  grafana-data:
  loki-data: