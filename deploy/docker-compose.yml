name: payment-stack

x-labels: &labels-payments
  com.northwind.owner: payments

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  POSTGRES_USER: payments
  POSTGRES_DB: payments
  DB_HOST: db
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_DEFAULT_USER: payments
  TRANSFERS_QUEUE: transfers
  TRANSFERS_DLQ: transfers.dlq
  TRANSFERS_DLX: transfers.dlx
  TRANSFERS_DLQ_ROUTING_KEY: transfers.dlq
  TRANSFERS_RETRY_QUEUE: transfers.retry
  TRANSFERS_RETRY_TTL_MS: "10000"
  WORKER_MAX_RETRIES: "3"

services:
  vault:
    image: hashicorp/vault:1.17.6
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-}
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-}
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging: *default-logging
    restart: unless-stopped
    labels: *labels-payments

  db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: payments
      POSTGRES_DB: payments
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging: *default-logging
    restart: unless-stopped
    labels: *labels-payments

  rabbitmq:
    image: rabbitmq:3.13.7-management
    environment:
      RABBITMQ_DEFAULT_USER: payments
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *default-logging
    restart: unless-stopped
    labels: *labels-payments

  migrate:
    profiles: ["tools"]
    image: ${IMAGE_PREFIX:-northwind}/payment-api-migrate:${APP_VERSION:?APP_VERSION is required}
    build:
      context: ..
      dockerfile: services/api/Dockerfile
      target: migrate
    env_file: runtime.env
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    restart: "no"
    labels: *labels-payments

  api:
    image: ${IMAGE_PREFIX:-northwind}/payment-api:${APP_VERSION:?APP_VERSION is required}
    build:
      context: ..
      dockerfile: services/api/Dockerfile
      target: runtime
    env_file: runtime.env
    environment:
      <<: *app-env
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      replicas: 2
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    labels: *labels-payments

  worker:
    image: ${IMAGE_PREFIX:-northwind}/payment-worker:${APP_VERSION:?APP_VERSION is required}
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    env_file: runtime.env
    environment:
      <<: *app-env
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROVIDER_URL: https://mock-provider:9443
      PROVIDER_CA_BUNDLE: /certs/cert.pem
    volumes:
      - provider-certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mock-provider:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    labels: *labels-payments

  certs-init:
    image: ${IMAGE_PREFIX:-northwind}/mock-provider:${APP_VERSION:?APP_VERSION is required}
    user: "0:0"
    entrypoint: ["sh", "-c", "mkdir -p /certs && chown -R 10003:10003 /certs"]
    volumes:
      - provider-certs:/certs
    restart: "no"
    logging: *default-logging
    labels: *labels-payments

  mock-provider:
    image: ${IMAGE_PREFIX:-northwind}/mock-provider:${APP_VERSION:?APP_VERSION is required}
    build:
      context: ..
      dockerfile: mock-provider/Dockerfile
    environment:
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-}
    volumes:
      - provider-certs:/certs
    depends_on:
      certs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request,sys; ctx=ssl._create_unverified_context(); sys.exit(0 if urllib.request.urlopen('https://127.0.0.1:9443/health', context=ctx, timeout=3).status == 200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging: *default-logging
    restart: unless-stopped
    labels: *labels-payments

  reverse-proxy:
    image: nginx:1.27.3
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${API_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    labels: *labels-payments

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    logging: *default-logging
    restart: unless-stopped
    labels: *labels-payments

volumes:
  pgdata:
  rabbitmq:
  provider-certs: